applications:
  - app: blinky
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - gpio
      - log+debug+gpio
    config_dir: ../deps/zpp_lib/configs

  - app: sanitize
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - shell
      - shell+debug
      - shell+san
    config_dir: ../deps/zpp_lib/configs

  - app: bme280
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
      - board: qemu_x86
    configs:
      - sensor
      - log+debug+sensor
    config_dir: ../deps/zpp_lib/configs

  # Phase B: BikeComputer Part I
  - app: bike_computer
    boards:
      - board: nrf5340dk/nrf5340/cpuapp
        shield: adafruit_2_8_tft_touch_v2
      - board: qemu_x86
    configs:
      - log+debug+gpio+display+sensor
    app_config: prj_static_scheduling.conf
